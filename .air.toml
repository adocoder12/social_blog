root = "."
tmp_dir = "bin"

[build]
  cmd = "go build -o ./bin/main ./cmd/api"
  bin = "./bin/main"
  delay = 1000
  exclude_dir = ["assets", "bin", "vendor", "testdata", "bin","docs","scripts"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html","env"]
  poll = true
  poll_interval = 500
  send_interrupt = true
  kill_delay = "500ms"
[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
